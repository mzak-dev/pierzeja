[package]
name = "pierzeja-app"
version.workspace = true
edition.workspace = true
description = "Natywna aplikacja Pierzei: Bevy (podgląd 3D) + egui (parametry, mapa typologii)."

[dependencies]
pierzeja-core.workspace = true
tabor-core.workspace = true
tlum-core.workspace = true
procedura-kit.workspace = true
serde_json.workspace = true
bevy = "0.20"
bevy_egui = "0.43"
egui-phosphor = "0.14"
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Location", "Element", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url"] }
