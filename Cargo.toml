[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
procedura-kit = { path = "crates/kit" }
pierzeja-core = { path = "crates/core" }
pierzeja-render = { path = "crates/render" }
tabor-core = { path = "crates/tabor" }
tlum-core = { path = "crates/tlum" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
